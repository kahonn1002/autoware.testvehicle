/**:
  ros__parameters:
    hardware_id: DemoCar_ISO
    enable_cameras: true
    require_camera_epoch: true
    use_manual_transmission: true
    source_base_offset_x: 0.863
    source_base_offset_y: 0.0
    source_base_offset_z: 0.0
    # AEB consumes /sensing/imu/imu_data while sensing launch is disabled,
    # so the ISO bridge publishes there directly (default profile unchanged).
    output_imu_topic: /sensing/imu/imu_data
    # CarMaker GenAngle handwheel -> tire conversion. Initial small-angle
    # McPherson value; verify sign and response with the supplied smoke test.
    steering_command_sign: -1.0
    steering_command_ratio: 13.66
    steering_feedback_sign: -1.0
    steering_feedback_ratio: 13.66
    max_steering_angle: 0.50
    max_steering_rate: 0.30
    command_timeout_sec: 0.5
    timeout_brake: 0.5
    stale_sensor_timeout_sec: 0.5
